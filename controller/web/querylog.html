<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>espDNS query log</title>
<link rel="icon" href="img/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="querylog.css">
</head>
<body>
<main>
  <div class="head">
    <div class="lead">
      <h1>Query log</h1>
      <p class="muted">What your devices asked, newest first, from every node.</p>
    </div>
  </div>
  <section class="qlsec">
    <form class="row qlbar" id="filters" autocomplete="off" role="search">
      <input class="t" id="qlq" type="search" spellcheck="false" placeholder="Filter by site or device" aria-label="Filter by site or device">
      <div class="row" role="group" aria-label="Show" id="show">
        <button class="btn small" type="button" data-show="all">Everything</button>
        <button class="btn small" type="button" data-show="blocked">Blocked</button>
        <button class="btn small" type="button" data-show="failed">Failed</button>
      </div>
      <select class="t qlnode" id="qlnode" aria-label="Node" hidden><option value="">Every node</option></select>
      <span class="chips" id="qlchips"></span>
      <span class="live"><span class="hint" id="qllive">Reading…</span> <button class="btn link small" type="button" id="pause">Pause</button></span>
    </form>
    <p class="hint qlkeep" id="qlkeep"></p>
    <div class="qlwarn" id="qlwarn"></div>
    <div class="panel rows ql" id="qlrows">
      <div class="r headr"><div>Time</div><div>Device</div><div>Site</div><div class="hide-n">Type</div><div>Answer</div><div class="hide-n took">Took</div></div>
    </div>
    <p class="hint" id="qlmore"></p>
  </section>
  <section id="most" hidden>
    <h2>Most asked</h2>
    <div class="grid2">
      <div class="panel pad stack" id="topsites"><h3>Sites</h3></div>
      <div class="panel pad stack" id="topdevices"><h3>Devices</h3></div>
    </div>
  </section>
  <section id="hour" hidden>
    <div class="sec-head"><h2>Last hour</h2><span class="hint" id="hourwhat"></span></div>
    <div class="minis" id="minis"></div>
  </section>
</main>
<script type="module" src="querylog.js"></script>
</body>
</html>
