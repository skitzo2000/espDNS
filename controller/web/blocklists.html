<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>espDNS blocking</title>
<link rel="icon" href="img/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="blocking.css">
</head>
<body>
<main>
  <div class="head">
    <div class="lead summary">
      <h1 id="title">Blocking</h1>
      <div class="facts" id="facts"></div>
    </div>
    <div class="row" id="head-actions"><div id="add-list"></div></div>
  </div>
  <div id="ask" hidden></div>
  <div id="loading" class="panel empty"><p>Reading…</p></div>
  <div id="off" class="panel empty" hidden>
    <h2>Blocking is off</h2>
    <p>Blocking answers "no such site" for ad, tracking and malware domains, on every node.</p>
    <div id="add-first"></div>
    <span class="hint">Pick a list from the catalogue, or add one by its web address.</span>
  </div>
  <div id="on" class="blocking" hidden>
    <div class="panel pad row spread" id="pause"></div>

    <section aria-labelledby="check-h">
      <h2 id="check-h">Check a site</h2>
      <div class="panel pad stack">
        <form class="check" id="checkform" autocomplete="off">
          <input class="t mono" id="checkq" placeholder="site.example" spellcheck="false" autocapitalize="off" aria-label="Site to check">
          <button class="btn" type="submit">Check</button>
        </form>
        <div id="verdict" aria-live="polite"></div>
      </div>
    </section>

    <section aria-labelledby="rules-h">
      <h2 id="rules-h">Your own rules</h2>
      <div class="exs" id="rules"></div>
    </section>

    <section aria-labelledby="lists-h">
      <div class="sec-head"><h2 id="lists-h">Your blocklists</h2></div>
      <div class="exs" id="lists"></div>
      <div class="panel pad stack refresh" id="refresh" hidden></div>
      <p class="hint" id="lists-hint"></p>
    </section>

    <section aria-label="Advanced">
      <div class="exs" id="advanced"></div>
    </section>
  </div>
</main>
<script type="module" src="blocking.js"></script>
</body>
</html>
